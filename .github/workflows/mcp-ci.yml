name: MCP CI
on:
  push:
    paths:
      - "services/google-sheets-mcp/**"
      - ".github/workflows/mcp-ci.yml"
  pull_request:
    paths:
      - "services/google-sheets-mcp/**"

jobs:
  test:
    runs-on: ubuntu-24.04
    
    defaults:
      run:
        working-directory: services/google-sheets-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: | 
            services/google-sheets-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test